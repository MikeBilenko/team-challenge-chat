<script src="/socket.io/socket.io.js"></script>
<input type="text" id="chatInput">
<input type="file" id="fileInput" multiple>
<input type="button" id="deleteLastMessage" value="Delete last message">
<input type="button" id="updateLastMessage" value="Update last message">
<script>
  const socket = io(); // put URL as a parameter
  socket.emit("ping", ()=>{console.log("pong delivered to server")});
  socket.on("pong", ()=>{console.log("pong")});

  const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY3NzA0NDdhMGEwYmNiODQ3MGQ5MjhlZSIsImlhdCI6MTczNjcwMDk2MCwiZXhwIjoxNzM2NzA0NTYwfQ.D0-T98lR-pOFug2dDNMn_wFbxuSqmrH5pAcClwnf7QA";
  
  const input = document.getElementById("chatInput");
  const fileInput = document.getElementById("fileInput");
  const deleteLastMessage = document.getElementById("deleteLastMessage");
  const updateLastMessage = document.getElementById("updateLastMessage");

  socket.emit("set chat rooms", token, (chats)=>{
    console.log(chats);

    input.onchange = () => {
      console.log(input.value);
      const message = document.createElement("p");
      message.innerHTML = input.value;
      document.body.insertBefore(message, document.body.lastElement);
      socket.emit("chat message", token, { message: input.value, chat_id: chats[0]._id }, ()=>{
        console.log("chat message delivered")
      });
    }

    fileInput.onchange = (e) => {
      console.log(fileInput.files);
      const message = document.createElement("p");
      message.innerHTML = input.value;
      document.body.insertBefore(message, document.body.lastElement);
      socket.emit("chat message", token, { message: input.value, chat_id: chats[0]._id, images: fileInput.files });
    }

    let lastMessages;
    
    socket.emit(
        "get messages before", 
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY3NzA0NDdhMGEwYmNiODQ3MGQ5MjhlZSIsImlhdCI6MTczNTQxMzAxMiwiZXhwIjoxNzM1NDE2NjEyfQ.rUjHAldTEAhwpSJO3GEx0BFfbwiTKN2cwHDB2NeQF7s", 
        chats[0]._id, Date.now(), (messages)=>{lastMessages = messages._rs.rows; console.log(messages)});

    
    deleteLastMessage.onclick = (e) => {
      socket.emit("delete chat message", token, lastMessages[0], (res) => {console.log(res)});
    }
    updateLastMessage.onclick = (e) => {
      let message = lastMessages[0];
      message.text = "Updated message";
      socket.emit("update chat message", token, message, (res) => {console.log(res)});
    }
  });


  socket.on("chat message", (messageObject) => {
    const message = document.createElement("p");
    console.log(messageObject);
    message.innerHTML = messageObject.name + ": " + messageObject.text;
    message.style.color = "blue";
    document.body.insertBefore(message, document.body.lastElement);
  });
</script>
